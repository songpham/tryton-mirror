[web]
listen = 0.0.0.0:8001
root = /app/www
num_proxies = 0
cache_timeout = 43200

[database]
uri = postgresql://postgres:postgres_grist@postgres-dev:5432/
path = /app/db
list = True
retry = 5
language = en
timeout = 1800

[cache]
transaction = 10
model = 200
record = 2000
field = 100
default = 1024
clean_timeout = 300
select_timeout = 60

[session]
authentications = password
max_age = 2592000
timeout = 300
max_attempt = 5

[password]
length = 8

[bus]
allow_subscribe = False
long_polling_timeout = 300